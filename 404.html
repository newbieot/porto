<!DOCTYPE html>
<html lang="id" data-theme="dark" data-build="20260814-bnga-q2-id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#080d18">
    <title>Halaman Tidak Ditemukan | Monitor Portofolio IDX</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/styles.20260814-bnga-q2.css">
    <script>
        (() => {
            const saved = localStorage.getItem('idx-theme');
            const preferred = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            document.documentElement.dataset.theme = saved || preferred;
        })();
    </script>
</head>
<body class="error-page">
    <main class="error-card">
        <div class="error-code">404</div>
        <h1>Tampilan pasar ini tidak tersedia.</h1>
        <p>Halaman yang diminta mungkin telah berpindah atau alamatnya belum lengkap.</p>
        <a class="button button-primary" href="/">Kembali ke ringkasan portofolio</a>
    </main>
</body>
</html>
