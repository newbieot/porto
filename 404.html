<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#080d18">
    <title>Page Not Found | IDX Portfolio Monitor</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/styles.css?v=20260725-1">
    <script>
        (() => {
            const saved = localStorage.getItem('idx-theme');
            const preferred = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            document.documentElement.dataset.theme = saved || preferred;
        })();
    </script>
</head>
<body class="error-page">
    <main class="error-card">
        <div class="error-code">404</div>
        <h1>This market view does not exist.</h1>
        <p>The requested page may have moved, or the address may be incomplete.</p>
        <a class="button button-primary" href="/">Return to portfolio overview</a>
    </main>
</body>
</html>
