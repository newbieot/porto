name: Update valuation bands

on:
  schedule:
    - cron: '15 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: valuation-data-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh three-year valuation history
        run: node scripts/update-valuation-data.mjs

      - name: Validate generated JSON
        run: node -e "const d=require('./data/valuation-bands.json'); if(!d.entities?.PORTFOLIO?.series?.length || d.holdings?.length !== 5) process.exit(1)"

      - name: Commit updated market data
        shell: bash
        run: |
          if git diff --quiet -- data/valuation-bands.json; then
            echo "No valuation data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/valuation-bands.json
          git commit -m "chore: update daily valuation bands"
          git pull --rebase origin main
          git push origin main
